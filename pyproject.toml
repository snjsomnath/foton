[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "foton-daylight"
version = "0.3.7"
description = "Fast annual daylight simulation on the GPU for Honeybee models, checked against Radiance"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Sanjay Somanath", email = "snjsomnath@gmail.com" }]
maintainers = [{ name = "Sanjay Somanath", email = "snjsomnath@gmail.com" }]
dependencies = ["numpy>=1.23"]
keywords = [
    "daylight",
    "daylight-simulation",
    "grasshopper",
    "rhino",
    "gpu",
    "radiance",
    "honeybee",
    "metal",
    "vulkan",
    "ray-tracing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/snjsomnath/foton"
Changelog = "https://github.com/snjsomnath/foton/blob/main/CHANGELOG.md"
Documentation = "https://github.com/snjsomnath/foton/tree/main/docs"
Issues = "https://github.com/snjsomnath/foton/issues"
Repository = "https://github.com/snjsomnath/foton"

[project.optional-dependencies]
honeybee = [
    "honeybee-core>=1.64,<2",
    "honeybee-radiance>=1.66,<2",
    "honeybee-radiance-postprocess>=0.5,<1",
    "ladybug-core>=0.44,<1",
    "platformdirs>=4.3,<5",
]
viewer = [
    "fastapi>=0.115,<1",
    "ladybug-core>=0.44,<1",
    "platformdirs>=4.3,<5",
    "python-multipart>=0.0.18,<1",
    "uvicorn>=0.32,<1",
    "websockets>=14,<17",
]
test = [
    "pytest>=8,<10",
]

[project.scripts]
foton-viewer = "foton.viewer.__main__:main"
daylight-viewer = "foton.viewer.__main__:main"
foton-honeybee = "foton.honeybee.__main__:main"

[tool.maturin]
manifest-path = "crates/daylight-python/Cargo.toml"
python-source = "python"
python-packages = ["foton", "daylight_engine", "honeybee_foton", "foton_bridge"]
module-name = "daylight_engine._native"
exclude = ["**/__pycache__/**", "**/*.pyc", "**/build_error.log"]
# abi3: one wheel per platform works on every Python from 3.10 on.
features = ["extension-module", "abi3"]
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
    { path = "THIRD_PARTY_LICENSES.md", format = "sdist" },
    { path = "CITATION.cff", format = "sdist" },
    { path = "grasshopper_foton/**/*", format = "sdist" },
    { path = "validation/*", format = "sdist" },
    { path = "scripts/**/*", format = "sdist" },
    { path = "test_models/*.hbjson", format = "sdist" },
    { path = "test_models/architectural/**/*", format = "sdist" },
    { path = "epw/*.epw", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "CONTRIBUTING.md", format = "sdist" },
    { path = "docs/**/*", format = "sdist" },
]
