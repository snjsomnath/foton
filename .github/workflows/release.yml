name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  acceptance:
    name: Verify committed release evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify the evidence named in validation/release-evidence.json
        shell: bash
        run: >-
          python scripts/verify_release_evidence.py
          --commit "$(git rev-parse HEAD)"
          --version "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"

  grasshopper:
    name: Verify and package Grasshopper download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install honeybee-core honeybee-radiance
      - run: python scripts/package_grasshopper.py
      - uses: actions/upload-artifact@v7
        with:
          name: grasshopper
          path: dist/foton-grasshopper-*.zip
          if-no-files-found: error

  yak:
    name: Build Rhino Package Manager (Yak) package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install honeybee-core honeybee-radiance
      - name: Download the Yak command-line tool
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/yak" https://files.mcneel.com/yak/tools/latest/linux-x64/yak
          chmod +x "$RUNNER_TEMP/yak"
      - run: python scripts/package_yak.py
        env:
          YAK: ${{ runner.temp }}/yak
      - uses: actions/upload-artifact@v7
        with:
          name: yak
          path: dist/foton-*.yak
          if-no-files-found: error

  wheels:
    # The extension uses Python's stable ABI (abi3), so one wheel per platform
    # covers Python 3.10 and later. The Intel Mac wheel is built on a native
    # Intel runner: the Vulkan crate compiles shaderc (C++) at build time,
    # which is not worth the risk of cross-compiling.
    name: Wheel / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux x86_64, os: ubuntu-latest, target: "", test: true}
          - {name: Windows x86_64, os: windows-latest, target: "", test: true}
          - {name: macOS arm64, os: macos-14, target: aarch64-apple-darwin, test: true}
          - {name: macOS x86_64, os: macos-15-intel, target: "", test: true}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ runner.os == 'Linux' && 'python3.10' || 'python' }}
          manylinux: "2014"
          rust-toolchain: "1.85"
      - name: Check the wheel is abi3
        shell: bash
        run: ls dist/*-abi3-*.whl
      - name: Test wheel on Python 3.10
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from foton import Engine; print(Engine().capabilities())"
      - uses: actions/setup-python@v7
        if: matrix.test
        with:
          python-version: "3.13"
      - name: Test wheel on Python 3.13
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from foton import Engine; print(Engine().capabilities())"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target || 'native' }}
          path: dist/*
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist, acceptance, grasshopper, yak]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: grasshopper
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: yak
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag

  yak-publish:
    name: Publish to Rhino Package Manager
    # After PyPI, because the components install that release on first use.
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: yak
          path: dist
      - name: Push the package
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        run: |
          if [ -z "$YAK_TOKEN" ]; then
            echo "No YAK_TOKEN secret: skipping. Push dist/foton-*.yak by hand (docs/publishing-yak.md)."
            exit 0
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/yak" https://files.mcneel.com/yak/tools/latest/linux-x64/yak
          chmod +x "$RUNNER_TEMP/yak"
          "$RUNNER_TEMP/yak" push dist/foton-*.yak
