name: CI

# Pull requests get the full check: Rust, Python on Linux, macOS and Windows,
# and a packaged wheel. A push to main (usually a pull request that just passed
# all of that) gets a quick Linux-only check. Changes that touch only prose or
# recorded benchmark results skip CI; the viewer has its own workflow.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "benchmarks/**"
      - "viewer/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "benchmarks/**"
      - "viewer/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: a cancelled run shows as failed on the README badge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Python on Linux, newest on macOS and Windows.
        # Pushes to main run only the Linux 3.13 row.
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"ubuntu-latest","python":"3.13"}]' || '[{"os":"ubuntu-latest","python":"3.10"},{"os":"ubuntu-latest","python":"3.13"},{"os":"macos-14","python":"3.13"},{"os":"windows-latest","python":"3.13"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - name: Install test dependencies
        run: >-
          python -m pip install --upgrade pip pytest numpy
          honeybee-core honeybee-radiance honeybee-radiance-postprocess
          fastapi ladybug-core platformdirs
          python-multipart uvicorn websockets
      - name: Build extension wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter python
          container: "off"
      - name: Install extension wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test Python package
        run: python -m pytest tests/python -q
      - name: Verify public and compatibility imports
        run: >-
          python -c "import foton, daylight_engine;
          assert foton.Engine is daylight_engine.Engine;
          print(foton.Engine().capabilities())"
      - name: Verify Honeybee bridge and protocol
        run: >-
          python -c "import honeybee_foton;
          from foton.honeybee import PROTOCOL_VERSION;
          assert PROTOCOL_VERSION == 1;
          print(honeybee_foton.__all__)"

  package:
    name: Package smoke test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter python3.13
          manylinux: "2014"
          rust-toolchain: "1.85"
      - name: Install wheel
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify wheel
        run: >-
          python -c "from importlib.metadata import version;
          from foton import Engine;
          print('foton-daylight', version('foton-daylight'));
          print(Engine().capabilities())"
