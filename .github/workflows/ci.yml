name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - name: Install test dependencies
        run: >-
          python -m pip install --upgrade pip pytest numpy
          honeybee-core honeybee-radiance honeybee-radiance-postprocess
          fastapi ladybug-core platformdirs
          python-multipart uvicorn websockets
      - name: Build extension wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter python
          container: "off"
      - name: Install extension wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Test Python package
        run: python -m pytest tests/python -q
      - name: Verify public and compatibility imports
        run: >-
          python -c "import foton, daylight_engine;
          assert foton.Engine is daylight_engine.Engine;
          print(foton.Engine().capabilities())"
      - name: Verify Honeybee bridge and protocol
        run: >-
          python -c "import honeybee_foton;
          from foton.honeybee import PROTOCOL_VERSION;
          assert PROTOCOL_VERSION == 1;
          print(honeybee_foton.__all__)"

  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter python3.13
          manylinux: "2014"
          rust-toolchain: "1.85"
      - name: Install wheel
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify wheel
        run: >-
          python -c "from importlib.metadata import version;
          from foton import Engine;
          print('foton-daylight', version('foton-daylight'));
          print(Engine().capabilities())"
