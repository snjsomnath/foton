name: Public beta acceptance

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validation:
    name: ${{ matrix.backend }} / Radiance and Rhino 8
    # Trusted runners with real GPUs and Radiance 6. Never run untrusted PRs here.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, macOS, ARM64, foton-metal]
            backend: metal
            system: Darwin
          - runner: [self-hosted, Windows, X64, foton-vulkan]
            backend: vulkan
            system: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
      - name: Build and install the current wheel
        run: python -m pip install --upgrade '.[honeybee,test]' 'lbt-recipes==0.28.8' setuptools
      - name: Verify package version
        run: python -c "import foton,tomllib; assert foton.__version__ == tomllib.load(open('pyproject.toml','rb'))['project']['version']"
      - name: Require actual GPU integration tests
        env:
          DAYLIGHT_ENGINE_METAL_TEST: '1'
          DAYLIGHT_ENGINE_VULKAN_TEST: '1'
        run: cargo test -p daylight-${{ matrix.backend }} --test reference_validation
      - name: Validate the complete architectural corpus in both sky bases
        run: python scripts/validate_release_suite.py --backend ${{ matrix.backend }} --output artifacts
      - name: Require current-commit live Rhino evidence
        shell: bash
        run: >-
          python scripts/verify_release_evidence.py
          --suite artifacts/suite.json --rhino "$FOTON_RHINO_EVIDENCE"
          --commit "$(git rev-parse HEAD)"
          --version "$(python -c 'import foton; print(foton.__version__)')"
          --backend ${{ matrix.backend }} --system ${{ matrix.system }}
      - name: Retain the verified Rhino evidence
        run: python -c "import os,shutil; shutil.copyfile(os.environ['FOTON_RHINO_EVIDENCE'], 'artifacts/rhino-evidence.json')"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-validation-${{ matrix.backend }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 90
