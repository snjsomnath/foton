name: Viewer

# The browser viewer is checked only when it changes.
on:
  push:
    branches: ["main"]
    paths: ["viewer/**"]
  pull_request:
    paths: ["viewer/**"]
  workflow_dispatch:

concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

