[workspace]
members = [
    "crates/daylight-core",
    "crates/daylight-metal",
    "crates/daylight-vulkan",
    "crates/daylight-python",
    "crates/daylight-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
ash = "0.38"
clap = { version = "4.5", features = ["derive"] }
numpy = "0.27"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
pyo3 = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shaderc = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
